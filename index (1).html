<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Ghezy Pramudinata Briliantama</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c0f'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff5a1f'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0c0f;--fg:#ecebe6;--mut:#8d9099;--ac:#ff5a1f;--line:#23262d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.55 "Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;display:block;touch-action:none;cursor:grab}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.k{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
header{position:fixed;left:32px;top:28px;z-index:2;pointer-events:none}
h1{margin:8px 0 0;font:300 clamp(30px,4.6vw,58px)/1.02 Georgia,"Times New Roman",serif;letter-spacing:-.5px}
h1 i{display:block}
.tag{margin:14px 0 0;color:var(--mut);max-width:34ch}
nav{position:fixed;left:32px;bottom:28px;z-index:2;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 64px)}
nav button{font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--fg);background:rgba(11,12,15,.6);border:1px solid var(--line);padding:8px 12px;border-radius:4px;cursor:pointer}
nav button:hover,nav button[aria-pressed=true]{border-color:var(--ac);color:var(--ac)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hint{position:fixed;right:32px;bottom:34px;z-index:1;pointer-events:none}
.lbl{position:fixed;z-index:1;pointer-events:none;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);transform:translate(-50%,0);transition:color .3s}
.lbl.on{color:var(--ac)}
#panel{position:fixed;right:0;top:0;height:100%;width:min(430px,92vw);z-index:3;padding:36px 32px;overflow:auto;background:rgba(11,12,15,.92);border-left:1px solid var(--line);backdrop-filter:blur(8px);transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
#panel h2{margin:6px 0 10px;font:300 38px/1.1 Georgia,serif}
#panel .lead{color:var(--mut);margin:0 0 20px}
#panel section{border-top:1px solid var(--line);padding:16px 0}
#panel h3{margin:0 0 4px;font-size:16px;font-weight:600}
#panel p{margin:0;color:var(--mut)}
#panel a{color:var(--fg);text-decoration:none;border-bottom:1px solid var(--ac)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags span{font:12px ui-monospace,Menlo,Consolas,monospace;padding:3px 8px;border:1px solid var(--line);border-radius:4px}
#x{position:absolute;right:20px;top:18px;background:none;border:0;color:var(--fg);font-size:28px;cursor:pointer}
@media(max-width:820px){.hint{display:none}header{left:20px}nav{left:20px;bottom:20px}}
</style>
</head>
<body>
<header><div class="k mono" id="uni"></div><h1 id="nm"></h1><p class="tag" id="tg"></p></header>
<nav id="nav" aria-label="Sections"></nav>
<div class="hint k mono">drag to rotate · click a card</div>
<aside id="panel" aria-live="polite"></aside>
<noscript><p style="position:fixed;inset:auto 32px 90px 32px">This page needs JavaScript.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== EDIT YOUR DATA HERE ===== */
const DATA = {
  uni: "Universitas Andalas · Sistem Informasi",
  first: "Ghezy Pramudinata", last: "Briliantama",
  tagline: "Software development, database design and system analysis.",
  nodes: [
    { id: "about", label: "about", title: "About",
      lead: "Information Systems student based in Padang, Indonesia (2024 – present).",
      items: [{ h: "Your story", p: "Write two or three honest sentences in your own words: what you are learning, and what you enjoy building." }] },
    { id: "stack", label: "stack", title: "Stack", lead: "Languages, frameworks and tools.",
      items: [
        { h: "Languages", tags: ["Python","SQL","JavaScript","HTML","CSS","C++","Java","Dart","Kotlin"] },
        { h: "Frameworks & libraries", tags: ["React","Express.js","Flutter","Tailwind CSS"] },
        { h: "Databases", tags: ["MySQL","PostgreSQL"] },
        { h: "Analysis & design", tags: ["ERD","BPMN","UML","PRD","System Request","Figma"] },
        { h: "Data", tags: ["Excel","Power BI","Jupyter / Colab"] } ] },
    { id: "projects", label: "projects", title: "Projects", lead: "Replace these placeholders with your own work.",
      items: [
        { h: "Project name", p: "One or two sentences: what it does and your role.", tags: ["tech","tech"], link: "" },
        { h: "Another project", p: "What problem it solves.", tags: ["tech"], link: "" },
        { h: "Third project", p: "What you learned from it.", tags: ["tech"], link: "" } ] },
    { id: "journey", label: "journey", title: "Journey", lead: "Programs and experience.",
      items: [
        { h: "Samsung Innovation Campus, Batch 7", p: "Student trainee, 2025/2026." },
        { h: "Gesture AI PBL, Nishio Rent All (Japan)", p: "March – September 2026." },
        { h: "Neo Telemetri Mobile Programming Bootcamp", p: "May – June 2025." } ] },
    { id: "contact", label: "contact", title: "Contact",
      items: [
        { h: "LinkedIn", p: "linkedin.com/in/ghezypb", link: "https://linkedin.com/in/ghezypb" },
        { h: "Email", p: "ghezy123@gmail.com", link: "mailto:ghezy123@gmail.com" },
        { h: "GitHub", p: "github.com/Ghezy123", link: "https://github.com/Ghezy123" } ] }
  ]
};
/* ===== END DATA ===== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
$("uni").textContent = DATA.uni; $("tg").textContent = DATA.tagline;
$("nm").innerHTML = esc(DATA.first) + "<i>" + esc(DATA.last) + "</i>";
const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let sel = null;

/* panel + nav (work even without WebGL) */
const btns = DATA.nodes.map(n => { const b = document.createElement("button"); b.textContent = n.label; b.setAttribute("aria-pressed","false"); b.onclick = () => select(n.id); $("nav").appendChild(b); return b; });
function select(id) {
  const i = DATA.nodes.findIndex(n => n.id === id), n = DATA.nodes[i]; sel = id;
  $("panel").innerHTML = '<button id="x" aria-label="Close">×</button><div class="k mono">' + esc(n.label) + "</div><h2>" + esc(n.title) + "</h2>" +
    (n.lead ? '<p class="lead">' + esc(n.lead) + "</p>" : "") +
    n.items.map(it => "<section><h3>" + (it.link ? '<a href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(it.h) + " ↗</a>" : esc(it.h)) + "</h3>" +
      (it.p ? "<p>" + esc(it.p) + "</p>" : "") + (it.tags ? '<div class="tags">' + it.tags.map(t => "<span>" + esc(t) + "</span>").join("") + "</div>" : "") + "</section>").join("");
  $("x").onclick = close; $("panel").classList.add("open");
  btns.forEach((b, k) => b.setAttribute("aria-pressed", k === i));
}
function close() { sel = null; $("panel").classList.remove("open"); btns.forEach(b => b.setAttribute("aria-pressed","false")); }
addEventListener("keydown", e => { if (e.key === "Escape") close(); });

/* ===== 3D scene ===== */
let R; try { R = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { R = null; }
if (R) {
  const ACC = 0xff5a1f, FG = 0xecebe6, N = DATA.nodes.length, RAD = 7.2;
  R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setSize(innerWidth, innerHeight); document.body.prepend(R.domElement);
  const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x0b0c0f, .028);
  const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 300); cam.position.set(0, 1.5, 17);
  const world = new THREE.Group(); scene.add(world);
  const lm = (c, o) => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: o });
  const bm = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, wireframe: o < 1 });

  const core = new THREE.Group(); world.add(core);
  core.add(new THREE.Mesh(new THREE.IcosahedronGeometry(2.4, 1), bm(ACC, .35)));
  core.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 0), new THREE.MeshBasicMaterial({ color: ACC })));
  const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(3.6, 0), bm(FG, .09)); core.add(shell);
  [0, 1].forEach(i => { const r = new THREE.Mesh(new THREE.TorusGeometry(RAD, .012, 6, 200), new THREE.MeshBasicMaterial({ color: FG, transparent: true, opacity: .18 })); r.rotation.set(Math.PI / 2 + (i ? .35 : 0), i ? .5 : 0, 0); world.add(r); });

  function card() {
    const g = new THREE.Group(), w = 2.6, h = 1.7;
    const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, .08)), lm(FG, .9)); g.add(edge);
    const p = [-w / 2, h / 2 - .45, 0, w / 2, h / 2 - .45, 0];
    for (let i = 0; i < 3; i++) { const y = h / 2 - .8 - i * .3; p.push(-w / 2 + .2, y, 0, -w / 2 + .2 + (i === 1 ? 1.1 : 1.6), y, 0); }
    const gg = new THREE.BufferGeometry(); gg.setAttribute("position", new THREE.Float32BufferAttribute(p, 3)); g.add(new THREE.LineSegments(gg, lm(FG, .45)));
    const dot = new THREE.Mesh(new THREE.CircleGeometry(.07, 12), new THREE.MeshBasicMaterial({ color: ACC })); dot.position.set(-w / 2 + .2, h / 2 - .22, .05); g.add(dot);
    const hit = new THREE.Mesh(new THREE.BoxGeometry(w + .4, h + .4, .4), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })); g.add(hit);
    g.userData = { hit, edge }; return g;
  }
  const cards = DATA.nodes.map((n, i) => {
    const a = i / N * Math.PI * 2, c = card();
    c.position.set(Math.sin(a) * RAD, Math.sin(i * 1.7) * 1.6, Math.cos(a) * RAD); c.rotation.y = a; world.add(c);
    Object.assign(c.userData, { a, id: n.id, base: c.position.y, t: i / N });
    world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), c.position.clone()]), lm(ACC, .35)));
    const pl = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 8), new THREE.MeshBasicMaterial({ color: ACC })); world.add(pl); c.userData.pulse = pl;
    const d = document.createElement("div"); d.className = "lbl mono"; d.textContent = n.label; document.body.appendChild(d); c.userData.lbl = d;
    return c;
  });
  cards.forEach((c, i) => world.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([c.position, cards[(i + 1) % N].position]), lm(FG, .12))));

  const sp = []; for (let i = 0; i < 1400; i++) { const r = 30 + Math.random() * 60, t = Math.random() * 6.283, u = Math.acos(2 * Math.random() - 1); sp.push(r * Math.sin(u) * Math.cos(t), r * Math.sin(u) * Math.sin(t), r * Math.cos(u)); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
  const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: FG, size: .12, transparent: true, opacity: .55, fog: false })); scene.add(stars);

  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), v = new THREE.Vector3(), clock = new THREE.Clock();
  let tx = 0, ty = 0, yaw = 0, vel = 0, drag = false, moved = 0, lx = 0, hover = null;
  function pick(e) {
    mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, cam);
    const h = ray.intersectObjects(cards.map(c => c.userData.hit))[0]; hover = h ? h.object.parent : null;
    R.domElement.style.cursor = hover ? "pointer" : drag ? "grabbing" : "grab"; return hover;
  }
  addEventListener("pointermove", e => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5;
    if (drag) { const dx = e.clientX - lx; lx = e.clientX; moved += Math.abs(dx); vel = dx * .004; yaw += vel; } else pick(e); });
  R.domElement.addEventListener("pointerdown", e => { drag = true; moved = 0; lx = e.clientX; });
  addEventListener("pointerup", e => { if (drag && moved < 6) { const h = pick(e); if (h) select(h.userData.id); else close(); } drag = false; });
  addEventListener("resize", () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); R.setSize(innerWidth, innerHeight); });

  (function frame() {
    requestAnimationFrame(frame); const t = clock.getElapsedTime();
    if (sel) { const a = cards[DATA.nodes.findIndex(n => n.id === sel)].userData.a; const d = ((-a - yaw + Math.PI) % 6.2832 + 6.2832) % 6.2832 - Math.PI; yaw += d * .07; }
    else if (!drag) { if (!rm) yaw += .0016; yaw += vel; vel *= .92; }
    world.rotation.y = yaw;
    const wide = innerWidth > 820;
    world.position.x += ((sel && wide ? -3.2 : 0) - world.position.x) * .06;
    cam.position.z += ((sel ? 11.5 : 17) - cam.position.z) * .05;
    cam.position.x += (tx * 3 - cam.position.x) * .04; cam.position.y += (1.5 - ty * 2 - cam.position.y) * .04; cam.lookAt(0, 0, 0);
    if (!rm) { core.rotation.y = t * .15; shell.rotation.x = t * .1; stars.rotation.y = t * .003; }
    cards.forEach((c, i) => {
      const u = c.userData, on = hover === c || sel === u.id;
      c.position.y = u.base + (rm ? 0 : Math.sin(t * .8 + i) * .15);
      c.scale.setScalar(c.scale.x + ((on ? 1.12 : 1) - c.scale.x) * .12);
      u.edge.material.color.setHex(on ? ACC : FG);
      if (!rm) u.t = (u.t + .004) % 1; u.pulse.position.copy(c.position).multiplyScalar(u.t);
      c.getWorldPosition(v); v.y -= 1.25; v.project(cam);
      u.lbl.style.display = v.z > 1 ? "none" : "block"; u.lbl.style.left = (v.x * .5 + .5) * innerWidth + "px"; u.lbl.style.top = (-v.y * .5 + .5) * innerHeight + "px"; u.lbl.classList.toggle("on", on);
    });
    R.render(scene, cam);
  })();
}
</script>
</body>
</html>
