<!doctype html>
<html lang="en">
<head>

<meta name="color-scheme" content="dark">
<title>Ghezy Pramudinata Briliantama</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0c0f'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%232f8cff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#0b0c0f;--fg:#ecebe6;--mut:#9498a3;--ac:#2f8cff;--lt:#7fc4ff;--line:#23262d;--d:"Space Grotesk","Segoe UI",Helvetica,Arial,sans-serif;--b:"Archivo","Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--fg);font:17px/1.55 var(--b)}
canvas{position:fixed;inset:0;display:block;touch-action:pan-y;cursor:grab;z-index:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header{position:fixed;left:4vw;top:4vh;z-index:2;pointer-events:none}
header .u{color:var(--mut);font-size:14px}
h1{margin:10px 0 0;font:700 clamp(38px,7vw,96px)/.95 var(--d);letter-spacing:-.04em}
h1 i{display:block;font-style:normal;color:var(--lt)}
.tag{margin:16px 0 0;color:var(--mut);max-width:30ch}

.hint{position:fixed;right:4vw;bottom:4.5vh;z-index:1;pointer-events:none;color:var(--mut);font-size:14px}
.bar{position:fixed;left:0;top:0;height:3px;background:var(--ac);z-index:4;width:0}
.lbl{position:fixed;z-index:1;pointer-events:none;font:500 13px var(--d);color:var(--mut);transform:translate(-50%,0)}
.lbl.on{color:var(--lt)}
.sec{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;padding:0 7vw;pointer-events:none}
.sec.r{justify-content:flex-end}
.box{max-width:min(460px,100%);pointer-events:auto;will-change:opacity,transform}
h2{margin:0 0 22px;font:700 clamp(52px,9vw,128px)/.9 var(--d);letter-spacing:-.045em;will-change:transform}
.box p{margin:0 0 14px;color:var(--mut)}
.box p.big{color:var(--fg);font:500 clamp(20px,2.2vw,28px)/1.3 var(--d);letter-spacing:-.01em}
ul{list-style:none;margin:8px 0 0;padding:0}
li{border-top:1px solid var(--line);padding:14px 0;transition:border-color .2s}

li h3{margin:0;font:500 19px var(--d)}
li p{margin:2px 0 0;font-size:15px}
li:hover h3,li:focus h3{color:var(--lt)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tags span,.chip{font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mut)}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}

.links a:hover{color:var(--lt);border-color:var(--ac)}
.links small{display:block;font:400 15px var(--b);color:var(--mut)}
.static .box{opacity:1!important;transform:none!important}.static .sec{pointer-events:auto}
@media(max-width:820px){.hint{display:none}.sec,.sec.r{align-items:flex-end;padding:0 5vw 11vh;justify-content:flex-start}.box{background:rgba(11,12,15,.6);backdrop-filter:blur(6px);padding:16px;border-radius:12px}h2{font-size:clamp(44px,15vw,72px)}}

.box ul.scroll{max-height:min(46vh,420px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding-right:6px}
.more{margin:6px 0 0;font-size:13px;color:var(--mut)}

.ph::before,.ph::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--ac);z-index:1}
.ph::before{top:-5px;left:-5px;border-right:0;border-bottom:0}.ph::after{bottom:-5px;right:-5px;border-left:0;border-top:0}
</style>
</head>

<script>
/* ===== EDIT YOUR DATA HERE =====
   Add a project / journey item : push { h, p, tags? } into that node's items.
   Add a tool to the stack      : add a string to a group's tags (or add a whole new group).
   Add a new section            : copy any node below, give it a unique id and pick
        type  : "text" | "stack" | "list" | "links"           (how the text panel looks)
        scene : "crystal" | "globe" | "slabs" | "path" | "beacon"  (+ older "knot" | "helix" | "orb")
   Nav button, orbit card, camera path, left/right side and object size are all generated. */
const DATA = {
  uni: "Universitas Andalas, Sistem Informasi",
  first: "Ghezy Pramudinata", last: "Briliantama",
  tagline: "Software development, database design and system analysis.",
  intro: "I turn messy requirements into working systems: map the process, design the data, build the app.",
  nodes: [
    { id: "about", label: "about", title: "About", type: "text", scene: "crystal", photo: "muka-gwej.png", // put me.jpg next to this file; "" = initials only; delete this key = no photo frame
      lead: "Information Systems student in Padang, Indonesia. 2024 to present." },
    { id: "stack", label: "stack", title: "Stack", type: "stack", scene: "globe", lead: "Drag the globe. Each word is a tool I use.",
      groups: [
        { h: "Languages", tags: ["Python","SQL","JavaScript","HTML","CSS","C++","Java","Dart","Kotlin"] },
        { h: "Frameworks", tags: ["React","Express.js","Flutter","Tailwind CSS"] },
        { h: "Databases", tags: ["MySQL","PostgreSQL"] },
        { h: "Analysis & design", tags: ["ERD","BPMN","UML","PRD","System Request","Figma"] },
        { h: "Data", tags: ["Excel","Power BI","Colab"] } ] },
    { id: "projects", label: "projects", title: "Projects", type: "list", scene: "slabs",
      items: [
        { h: "Project name", p: "What it does and your role.", tags: ["tech","tech"] },
        { h: "Another project", p: "What problem it solves.", tags: ["tech"] },
        { h: "Third project", p: "What you learned from it.", tags: ["tech"] } ] },
    { id: "journey", label: "journey", title: "Journey", type: "list", scene: "path",
      items: [
        { h: "Samsung Innovation Campus, Batch 7", p: "Student trainee, 2025/2026" },
        { h: "Gesture AI PBL, Nishio Rent All (Japan)", p: "March to September 2026" },
        { h: "Neo Telemetri Mobile Bootcamp", p: "May to June 2025" } ] },
    { id: "contact", label: "contact", title: "Say hello", type: "links", scene: "beacon",
      items: [
        { h: "LinkedIn", p: "linkedin.com/in/ghezypb", link: "https://linkedin.com/in/ghezypb" },
        { h: "Email", p: "ghezy123@gmail.com", link: "mailto:ghezy123@gmail.com" },
        { h: "GitHub", p: "github.com/Ghezy123", link: "https://github.com/Ghezy123" } ] }
  ]
};
/* ===== END DATA ===== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CAT = ["#2f8cff","#7fc4ff","#ecebe6","#4de1ff","#a3adff"], col = i => CAT[i % CAT.length];
const side = i => i ? (i % 2 ? 1 : -1) : 0; // which side the 3D object sits on (0 = centre), text goes opposite
const hi = {}; // hovered list item per node id
const CAP = { slabs: 6, path: 8, helix: 8 }; // max items drawn in 3D per scene; extra items stay in the text list
$("uni").textContent = DATA.uni; $("tg").textContent = DATA.tagline;
$("nm").innerHTML = esc(DATA.first) + "<i>" + esc(DATA.last) + "</i>";

/* ===== text panels, one builder per type ===== */
const li = (it, i, id) => '<li tabindex="0" data-k="' + esc(id) + '" data-i="' + i + '"><h3>' + esc(it.h) + "</h3>" + (it.p ? "<p>" + esc(it.p) + "</p>" : "") + (it.tags ? '<div class="tags">' + it.tags.map(t => "<span>" + esc(t) + "</span>").join("") + "</div>" : "") + "</li>";
const lead = n => n.lead ? "<p>" + esc(n.lead) + "</p>" : "";
const BODY = {
  text: n => (n.photo === undefined ? "" : '<figure class="ph">' + esc(DATA.first[0] + DATA.last[0]) + (n.photo ? '<img src="' + esc(n.photo) + '" alt="' + esc(DATA.first + " " + DATA.last) + '" loading="lazy" onerror="this.remove()">' : "") + "</figure>") + '<p class="big">' + esc(n.big || DATA.intro) + "</p>" + lead(n),
  stack: n => lead(n) + '<div class="legend" aria-hidden="true">' + n.groups.map((g, i) => '<span class="chip"><i style="background:' + col(i) + '"></i>' + esc(g.h) + "</span>").join("") + '</div><ul class="sr">' + n.groups.map(g => "<li>" + esc(g.h) + ": " + g.tags.map(esc).join(", ") + "</li>").join("") + "</ul>",
  list: n => lead(n) + '<ul class="scroll">' + n.items.map((it, i) => li(it, i, n.id)).join("") + "</ul>" + (CAP[n.scene] && n.items.length > CAP[n.scene] ? '<p class="more">+' + (n.items.length - CAP[n.scene]) + " more</p>" : ""),
  links: n => '<div class="links">' + n.items.map(it => '<a href="' + esc(it.link) + '" target="_blank" rel="noopener">' + esc(it.h) + "<small>" + esc(it.p) + "</small></a>").join("") + "</div>"
};
DATA.nodes.forEach((n, i) => { const s = document.createElement("section"); s.className = "sec" + (side(i + 1) > 0 ? "" : " r"); s.id = n.id;
  s.innerHTML = '<div class="box"><h2>' + esc(n.title) + "</h2>" + (BODY[n.type] || BODY.list)(n) + "</div>"; $("main").appendChild(s); });
const secEls = [$("home"), ...DATA.nodes.map(n => $(n.id))], boxes = [null, ...document.querySelectorAll(".box")];
const go = i => secEls[i].scrollIntoView({ behavior: rm ? "auto" : "smooth", block: "start" });
const btns = ["home", ...DATA.nodes.map(n => n.label)].map((l, i) => { const b = document.createElement("button"); b.textContent = l; b.onclick = () => go(i); $("nav").appendChild(b); return b; });

let centers = [], target = 0;
const meas = () => { centers = secEls.map(e => e.offsetTop + e.offsetHeight / 2); };
const sFrom = () => { const y = scrollY + innerHeight / 2; if (y <= centers[0]) return 0; for (let i = 0; i < centers.length - 1; i++) if (y < centers[i + 1]) return i + (y - centers[i]) / (centers[i + 1] - centers[i]); return centers.length - 1; };
const mark = s => { const c = Math.round(s); btns.forEach((b, i) => b.setAttribute("aria-current", i === c)); $("bar").style.width = s / (secEls.length - 1) * 100 + "%"; };
addEventListener("scroll", () => { target = sFrom(); mark(target); }, { passive: true });
addEventListener("resize", () => { meas(); target = sFrom(); });
addEventListener("load", () => { meas(); target = sFrom(); mark(target); }); meas(); mark(0);
document.querySelectorAll("li[data-k]").forEach(e => { const k = e.dataset.k, i = +e.dataset.i;
  e.onmouseenter = e.onfocus = () => hi[k] = i; e.onmouseleave = e.onblur = () => hi[k] = -1; });

/* ===== 3D ===== */
let R; try { R = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { R = null; }
if (!R) document.body.classList.add("static"); else {
  const ACC = 0x2f8cff, LT = 0x7fc4ff, FG = 0xecebe6, D = 34, NS = secEls.length, N = DATA.nodes.length, wide = () => innerWidth > 820;
  R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setSize(innerWidth, innerHeight); document.body.prepend(R.domElement);
  R.domElement.setAttribute("role", "img"); R.domElement.setAttribute("aria-label", "Interactive 3D scene. Scroll to travel between sections, drag to spin objects.");
  const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x0b0c0f, .02);
  const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, .1, 400);
  const lm = (c, o) => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: o });
  const wm = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, wireframe: true });
  const sm = c => new THREE.MeshBasicMaterial({ color: c });
  const lerp = (a, b, k) => a + (b - a) * k, cl = x => Math.max(0, Math.min(1, x)), near = (i, w) => cl(1 - Math.abs(sS - i) * w);
  const stn = [], offs = [];
  for (let i = 0; i < NS; i++) { const g = new THREE.Group(); g.position.z = -i * D; const o = new THREE.Group(); g.add(o); scene.add(g); stn.push(g); offs.push(o); }
  const layout = () => offs.forEach((o, i) => o.position.set(wide() ? side(i) * 3.4 : 0, wide() || !i ? 0 : 1.7, 0));
  function card(w = 2.6, h = 1.7) {
    const g = new THREE.Group(), edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, .08)), lm(FG, .9)); g.add(edge);
    const p = [-w / 2, h / 2 - .45, 0, w / 2, h / 2 - .45, 0];
    for (let i = 0; i < 3; i++) { const y = h / 2 - .8 - i * .3; p.push(-w / 2 + .2, y, 0, -w / 2 + .2 + (i === 1 ? 1.1 : 1.6), y, 0); }
    const gg = new THREE.BufferGeometry(); gg.setAttribute("position", new THREE.Float32BufferAttribute(p, 3)); g.add(new THREE.LineSegments(gg, lm(FG, .45)));
    const dot = new THREE.Mesh(new THREE.CircleGeometry(.07, 12), sm(ACC)); dot.position.set(-w / 2 + .2, h / 2 - .22, .05); g.add(dot);
    const hit = new THREE.Mesh(new THREE.BoxGeometry(w + .4, h + .4, .4), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })); g.add(hit);
    g.userData = { hit, edge }; return g;
  }
  const glowTex = () => { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(.08, "rgba(220,238,255,.7)"); g.addColorStop(.25, "rgba(127,196,255,.18)"); g.addColorStop(1, "rgba(47,140,255,0)");
    x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); };

  const GT = glowTex(), UPV = new THREE.Vector3(0, 1, 0), M4 = new THREE.Matrix4();
  const glow = (c, s, o) => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: GT, color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false })); sp.scale.set(s, s, 1); return sp; };
  const halo = (r, c) => new THREE.Mesh(new THREE.SphereGeometry(r * 1.13, 32, 24), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
    uniforms: { c: { value: new THREE.Color(c) } }, vertexShader: SH.vertex, fragmentShader: "uniform vec3 c;varying vec3 vP,vW,vN;void main(){float f=pow(smoothstep(0.,.5,-vN.z),2.);gl_FragColor=vec4(c,f*.8);}" }));

  /* ---------- 0 home: procedural planet core (no image assets) ---------- */
  const hero = offs[0], core = new THREE.Group(); hero.add(core);
  const SUN = new THREE.Vector3(1, .5, .3).normalize(), SH = { vertex: "varying vec3 vP,vW,vN;void main(){vP=position;vW=normalize(mat3(modelMatrix)*normal);vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}" };
  const planet = new THREE.Mesh(new THREE.SphereGeometry(2.4, 96, 64), new THREE.ShaderMaterial({ uniforms: { time: { value: 0 }, sun: { value: SUN } }, vertexShader: SH.vertex, fragmentShader:
    `uniform float time;uniform vec3 sun;varying vec3 vP,vW,vN;
    float h(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
    float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
    float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n3(p);p=p*2.03+7.1;a*=.5;}return s;}
    void main(){vec3 p=normalize(vP);float e=fbm(p*2.2+3.);float land=smoothstep(.5,.56,e);
      vec3 sea=mix(vec3(.02,.07,.2),vec3(.05,.2,.5),smoothstep(.2,.5,e));vec3 ter=mix(vec3(.2,.5,.85),vec3(.8,.93,1.),smoothstep(.56,.8,e));
      vec3 c=mix(sea,ter,land);float cl=smoothstep(.56,.82,fbm(p*3.5+vec3(time*.03,0.,time*.02)));c=mix(c,vec3(.93,.96,1.),cl*.7);
      float l=dot(normalize(vW),sun);float day=smoothstep(-.05,.3,l);
      float city=step(.94,h(floor(p*80.)))*land*(1.-cl);vec3 night=c*.05+vec3(.45,.75,1.)*city*.9;
      gl_FragColor=vec4(mix(night,c*(.12+1.05*pow(max(l,0.),.7)),day),1.);}` }));
  const atmo = new THREE.Mesh(new THREE.SphereGeometry(2.4 * 1.13, 64, 48), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending, uniforms: { sun: { value: SUN } }, vertexShader: SH.vertex, fragmentShader:
    `uniform vec3 sun;varying vec3 vP,vW,vN;void main(){float f=pow(smoothstep(0.,.5,-vN.z),2.);float l=max(0.,dot(normalize(vW),sun));
      gl_FragColor=vec4(mix(vec3(.18,.48,1.),vec3(.75,.92,1.),l),f*(.3+.9*l));}` }));
  core.add(planet, new THREE.Mesh(new THREE.IcosahedronGeometry(2.46, 2), wm(ACC, .12)));
  hero.add(atmo);
  const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex(), transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false })); sun.position.set(6.5, 4, -9); sun.scale.set(11, 11, 1); stn[0].add(sun);
  const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(3.6, 0), wm(FG, .09)); core.add(shell);
  const tilt = new THREE.Group(); tilt.rotation.set(.45, 0, -.3); hero.add(tilt);
  const orbit = new THREE.Mesh(new THREE.TorusGeometry(4.5, .008, 6, 160), new THREE.MeshBasicMaterial({ color: FG, transparent: true, opacity: .14 })); orbit.rotation.x = Math.PI / 2; tilt.add(orbit);
  const sat = new THREE.Group(); sat.add(new THREE.Mesh(new THREE.OctahedronGeometry(.17), sm(LT)), new THREE.Mesh(new THREE.OctahedronGeometry(.3), wm(FG, .35))); tilt.add(sat);
  const RR = Math.max(7.2, N * .55); // orbit radius grows when you add sections
  [0, 1].forEach(i => { const r = new THREE.Mesh(new THREE.TorusGeometry(RR, .012, 6, 200), new THREE.MeshBasicMaterial({ color: FG, transparent: true, opacity: .18 })); r.rotation.set(Math.PI / 2 + (i ? .35 : 0), i ? .5 : 0, 0); hero.add(r); });
  const cards = DATA.nodes.map((n, i) => {
    const a = i / N * Math.PI * 2, c = card(); c.position.set(Math.sin(a) * RR, Math.sin(i * 1.7) * 1.6, Math.cos(a) * RR); c.rotation.y = a; hero.add(c);
    Object.assign(c.userData, { a, idx: i + 1, base: c.position.y, t: i / N });
    hero.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), c.position.clone()]), lm(ACC, .35)));
    const pl = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 8), sm(ACC)); hero.add(pl); c.userData.pulse = pl;
    const d = document.createElement("div"); d.className = "lbl"; d.textContent = n.label; document.body.appendChild(d); c.userData.lbl = d; return c;
  });
  cards.forEach((c, i) => hero.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([c.position, cards[(i + 1) % N].position]), lm(FG, .12))));

  /* ---------- scene registry: each builder returns update(q) ---------- */
  // q = { t, sx, sy, yaw, n: closeness 0..1, hi: hovered item index or -1 }
  const SC = {
    knot(g) { const k = new THREE.Group(); g.add(k);
      k.add(new THREE.Mesh(new THREE.TorusKnotGeometry(2, .5, 160, 18, 2, 3), wm(ACC, .5)), new THREE.Mesh(new THREE.TorusKnotGeometry(2, .5, 60, 8, 2, 3), wm(FG, .1)), new THREE.Mesh(new THREE.IcosahedronGeometry(.7, 0), sm(LT)));
